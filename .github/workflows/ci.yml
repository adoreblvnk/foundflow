name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_DISABLED: "false"
      AUTH_SECRET: ci-test-secret-32-chars-minimum!!
      DATA_PROTECTION_MODE: disabled
      LOGIN_USERNAME: testuser
      LOGIN_PASSWORD: testpass123
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test

      - run: npm run build

      - run: npx playwright install --with-deps chrome

      - run: npm run test:e2e:playwright:only
