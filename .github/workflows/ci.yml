name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test
        env:
          AUTH_SECRET: ci-test-secret-32-chars-minimum!!
          LOGIN_USERNAME: testuser
          LOGIN_PASSWORD: testpass123

      - run: npm run build

      - run: npx playwright install --with-deps chrome

      - run: npm run test:e2e:playwright:only
